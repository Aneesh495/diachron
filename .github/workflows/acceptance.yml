name: acceptance

# Manually triggered, resource-heavy campaign. This runs the full inference
# profile and independent verification and retains the raw artifacts. A green
# lightweight CI run does NOT certify this; only a successful acceptance run with
# retained evidence does.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Evidence run id"
        required: true
        default: "manual"
      profile:
        description: "Full acceptance checks or observed research execution"
        type: choice
        options: [full, observed]
        default: full

jobs:
  observed:
    if: inputs.profile == 'observed'
    permissions:
      contents: write
    uses: ./.github/workflows/observed-research.yml
    with:
      component: all
  acceptance:
    if: inputs.profile == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: ui/.nvmrc

      - name: Bootstrap and build
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements-dev.txt
          maturin develop --locked --release
          npm --prefix ui ci --ignore-scripts
          ui/node_modules/.bin/puppeteer browsers install chrome
          python -m diachron.cli.main acquire --out runs/inputs --study iecor --study abvd

      - name: Run acceptance campaign
        run: |
          . .venv/bin/activate
          python -m diachron.cli.main acceptance --run-id "$RUN_ID" --profile full --inputs runs/inputs
        env:
          RUN_ID: ${{ inputs.run_id }}

      - name: Independent verification
        if: always()
        run: |
          . .venv/bin/activate
          python -m diachron.cli.main verify --evidence "evidence/$RUN_ID" --expected-commit "$GITHUB_SHA"
        env:
          RUN_ID: ${{ inputs.run_id }}

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.event.inputs.run_id }}
          path: |
            evidence/${{ github.event.inputs.run_id }}/ACCEPTANCE.json
            evidence/${{ github.event.inputs.run_id }}/MANIFEST.json
            evidence/${{ github.event.inputs.run_id }}/REQUIREMENTS.json
            evidence/${{ github.event.inputs.run_id }}/COMMANDS.jsonl
            evidence/${{ github.event.inputs.run_id }}/*.log
          retention-days: 30
