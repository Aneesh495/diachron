name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          # Publish the existing self-contained preview and its companion thesis.
          gh release download v0.1.0-preview --repo "$GITHUB_REPOSITORY" --pattern 'Diachron_*.html' --pattern SHA256SUMS --dir _site
          (cd _site && grep 'Diachron_' SHA256SUMS | sha256sum -c -)
          python3 scripts/prepare_pages.py _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
