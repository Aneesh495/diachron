name: ci

# Lightweight CI on ordinary pushes: build, static checks, deterministic
# correctness tests, a real integration path, verifier negative controls,
# packaging, and docs. Resource-heavy campaigns run separately (see
# acceptance.yml) and are not certified by this workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Cancel superseded runs on the same ref without hiding failures on others.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/diachron-core/target
          key: cargo-${{ hashFiles('rust/diachron-core/Cargo.lock') }}

      - name: Create venv and install tooling
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements-dev.txt

      - name: Rust unit tests
        run: cd rust/diachron-core && cargo test --locked --lib

      - name: Build extension
        run: . .venv/bin/activate && maturin develop --locked --release

      - name: Python correctness suite
        run: . .venv/bin/activate && python -m pytest tests -q

      - name: Likelihood oracle (G02)
        run: . .venv/bin/activate && python -m diachron.cli.main likelihood-check --cases 1000

      - name: Bounded integration demo and saved-draw replay
        run: |
          . .venv/bin/activate
          python -m diachron.cli.main demo
          python -m diachron.cli.main verify --evidence runs/demo --expected-commit "$GITHUB_SHA"

      - name: Check diagrams and render thesis
        run: |
          . .venv/bin/activate
          python -m diachron.cli.main docs check
          python -m diachron.cli.main thesis build

      - name: Build a wheel
        run: . .venv/bin/activate && maturin build --locked --release --out runs/wheels

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
      - name: Install and typecheck workbench
        run: |
          cd ui
          npm ci --ignore-scripts
          npm run typecheck
          npm run build
